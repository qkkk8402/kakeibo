name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use the vMAJOR.MINOR.PATCH format (for example, v1.0.0)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on the main branch."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch_with_suffix <<< "$version"
          patch="${patch_with_suffix%%[-+]*}"
          # Keep the value within Android's signed 32-bit versionCode limit and
          # make it deterministic for a given semantic version.
          major=$((10#$major))
          minor=$((10#$minor))
          patch=$((10#$patch))
          if (( major > 1999 || minor > 999 || patch > 999 )); then
            echo "::error::Version components must be major<=1999, minor<=999, patch<=999."
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::Computed versionCode is outside Android's supported range."
            exit 1
          fi
          {
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_VERSION_CODE=$version_code"
          } >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check signing secrets and prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing GitHub Actions secret for $variable."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kakeibo-release.jks"
          test -s "$RUNNER_TEMP/kakeibo-release.jks"
          chmod 600 "$RUNNER_TEMP/kakeibo-release.jks"

      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kakeibo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            -PreleaseVersionName="$RELEASE_VERSION" \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            --no-daemon --stacktrace

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/kakeibo-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"

          gh release create "$RELEASE_TAG" "$apk" \
            --repo "$REPOSITORY" \
            --title "Kakeibo $RELEASE_TAG" \
            --generate-notes
